<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - Sistem Arayüzü</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: #020617;
    color: #38bdf8;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 100vh;
    padding: 15px;
    overflow-x: hidden;
  }

  header {
    text-align: center;
    width: 100%;
    border-bottom: 1px solid #1e293b;
    padding-bottom: 8px;
  }

  h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 4px;
    color: #38bdf8;
    text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
  }

  .container {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 420px;
    gap: 15px;
    align-items: center;
  }

  /* Sol Panel (Bilgiler) */
  .stats-panel {
    display: flex;
    justify-content: space-between;
    width: 100%;
    gap: 10px;
  }

  .card {
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #0284c7;
    border-radius: 8px;
    padding: 10px;
    flex: 1;
    font-size: 11px;
    color: #94a3b8;
    box-shadow: 0 0 10px rgba(2, 132, 199, 0.2);
  }

  .card span {
    color: #38bdf8;
    font-weight: bold;
    display: block;
    margin-top: 3px;
    font-size: 12px;
  }

  /* Merkezdeki Holografik Radar / Ark Reaktörü */
  .hologram-radar {
    width: 180px;
    height: 180px;
    border: 2px dashed #0284c7;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 0 25px rgba(2, 132, 199, 0.3), inset 0 0 25px rgba(2, 132, 199, 0.3);
    animation: spinRadar 15s linear infinite;
  }

  .radar-core {
    width: 70px;
    height: 70px;
    background: radial-gradient(circle, #38bdf8 0%, #0284c7 100%);
    border-radius: 50%;
    box-shadow: 0 0 25px #38bdf8, 0 0 50px #38bdf8;
    animation: pulseCore 2s ease-in-out infinite alternate;
  }

  @keyframes spinRadar {
    100% { transform: rotate(360deg); }
  }

  @keyframes pulseCore {
    0% { transform: scale(0.9); opacity: 0.8; }
    100% { transform: scale(1.1); opacity: 1; }
  }

  /* Sağ/Alt Terminal Konsolu */
  .terminal {
    background: rgba(3, 7, 18, 0.95);
    border: 1px solid #1e293b;
    border-radius: 8px;
    width: 100%;
    height: 80px;
    padding: 8px 12px;
    font-size: 11px;
    color: #34d399;
    text-align: left;
    overflow-y: auto;
  }

  /* İnput ve Kontroller */
  .input-group {
    width: 100%;
    display: flex;
    gap: 8px;
  }

  input[type="text"] {
    flex: 1;
    padding: 10px;
    background: #0f172a;
    border: 1px solid #0284c7;
    border-radius: 6px;
    color: #38bdf8;
    font-size: 13px;
    outline: none;
  }

  button {
    background: #0284c7;
    border: 1px solid #38bdf8;
    color: white;
    padding: 0 16px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
  }

  button:active {
    background: #0369a1;
  }

  /* Kurucu Footer */
  footer {
    text-align: center;
    color: #64748b;
    font-size: 11px;
    letter-spacing: 2px;
    width: 100%;
    border-top: 1px solid #1e293b;
    padding-top: 10px;
  }

  footer span {
    color: #38bdf8;
    font-weight: bold;
  }
</style>
</head>
<body>

  <header>
    <h1>J.A.R.V.I.S. OS</h1>
  </header>

  <div class="container">
    <!-- Sol/Üst Bilgi Panelleri (Saat ve Hava Durumu) -->
    <div class="stats-panel">
      <div class="card">
        ZAMAN
        <span id="liveClock">00:00:00</span>
      </div>
      <div class="card">
        ŞANLIURFA HAVA
        <span id="weatherText">Yükleniyor...</span>
      </div>
    </div>

    <!-- Merkez Hologram Radar -->
    <div class="hologram-radar">
      <div class="radar-core"></div>
    </div>

    <!-- Terminal Ekranı (Sistem Durumu) -->
    <div class="terminal" id="terminalLog">
      [SİSTEM]: Çekirdek aktif. Yapay zeka modülü devre dışı.<br>
      [BİLGİ]: Soru sorma sistemi kapalı.
    </div>

    <!-- Komut Satırı -->
    <div class="input-group">
      <input type="text" id="userInput" placeholder="Komut yazın..." aria-label="Komut">
      <button id="sendBtn">ÇALIŞTIR</button>
    </div>
  </div>

  <footer>
    KURUCU: <span>YUSUF EFE YILDIZ</span>
  </footer>

<script>
  // 1. Canlı Saat
  function updateClock() {
    const now = new Date();
    document.getElementById("liveClock").textContent = now.toLocaleTimeString('tr-TR');
  }
  setInterval(updateClock, 1000);
  updateClock();

  // 2. Şanlıurfa Hava Durumu
  function loadWeather() {
    const month = new Date().getMonth() + 1;
    let weather = "29°C / Açık";
    if (month >= 11 || month <= 2) {
      weather = "15°C / Serin";
    } else if (month >= 6 && month <= 8) {
      weather = "40°C / Sıcak";
    }
    document.getElementById("weatherText").textContent = weather;
  }
  loadWeather();

  // 3. Soru Sorulduğunda "Sistem Kapalı" Uyarısı Verme
  const terminalLog = document.getElementById("terminalLog");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  function handleCommand() {
    const text = userInput.value.trim();
    if (!text) return;
    
    userInput.value = "";
    terminalLog.innerHTML += `<br>[KOMUT]: ${text} <br><span style="color:#f87171;">[HATA]: Sistem kapalı! Yapay zeka yanıt veremez.</span>`;
    terminalLog.scrollTop = terminalLog.scrollHeight;
  }

  sendBtn.addEventListener("click", handleCommand);
  userInput.value = "";
  userInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
      handleCommand();
    }
  });
</script>

</body>
</html>
